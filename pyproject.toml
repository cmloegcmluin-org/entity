[project]
name = "entity"
version = "0.1.0"
description = "The Entity — a local, voice-in/voice-out, memory-persistent Claude pairing partner."
requires-python = ">=3.11"
# Text-to-speech is Windows' built-in System.Speech (via PowerShell, no package).
dependencies = [
    "claude-agent-sdk>=0.2",     # persistent Claude session on the Max plan (the brain)
    "onnx-asr[cpu,hub]>=0.11",   # local Parakeet speech-to-text
    "sounddevice>=0.4",          # microphone capture
    # What the PC itself is playing, so the mic can discount it. sounddevice's PortAudio build has
    # no WASAPI loopback - no flag, no loopback devices - so the capture needs its own library.
    "soundcard>=0.4",
    "numpy>=1.26",               # audio frames + energy VAD
    "flask>=3",                  # the window is a local web app, as in Notecraft
    "pywebview>=5",              # ...shown in its own native window rather than a browser tab
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Only tools/install-start-menu.ps1 needs this, to stamp the shortcut's AppUserModelID so a
# taskbar pin and the running window are one button. The app itself never imports it.
setup = ["pywin32>=306"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
