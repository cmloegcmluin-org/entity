[project]
name = "entity"
version = "0.1.0"
description = "The Entity — a local, voice-in/voice-out, memory-persistent Claude pairing partner."
requires-python = ">=3.11"
# The brain is the `claude` CLI (external) and v1 text-to-speech is Windows'
# built-in System.Speech (via PowerShell), so this milestone needs no third-party
# runtime packages. Microphone speech-to-text (Parakeet) adds onnx-asr + sounddevice
# in the next increment.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
